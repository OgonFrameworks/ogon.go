run:
  timeout: 5m
  go: "1.27"

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gofmt
    - revive
    - gosec
    - bodyclose
    - copyloopvar
    - errorlint

linters-settings:
  errcheck:
    check-type-assertions: false
  govet:
    enable-all: false
  staticcheck:
    checks: ["all"]

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck]
    - path: examples/
      linters: [all]
  max-issues-per-linter: 0
  max-same-issues: 0
