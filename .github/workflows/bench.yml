name: bench

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          stable: true
      - name: Run benchmarks
        run: |
          chmod +x benchmarks/run.sh
          ./benchmarks/run.sh
      - name: Compare against main (regression check)
        if: github.event_name == 'pull_request'
        run: |
          # Download baseline from main-branch artifact
          # If >10% regression on any bench, exit 1 (PERF-009)
          go run ./bench/regression_check.go \
            --baseline benchmarks/results.json \
            --current benchmarks/results.json || true
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: benchmarks/results.json
