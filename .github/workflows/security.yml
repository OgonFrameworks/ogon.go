#
# Security CI gate. Runs on every pull request and nightly on schedule.
# Gates the merge on:
#   1. govulncheck — fail on any reachable Critical or High CVE.
#   2. gitleaks   — fail on any secret detected in the diff.
#   3. static checks — go vet + gofmt + the auth supply-chain audit.
#
# Findings are documented in SECURITY_AUDIT.md at the repo root; the
# audit document is regenerated by the `ogon verify security` CLI
# subcommand (Phase 15+).

name: security

on:
  pull_request:
    branches: [main, release/*]
  push:
    branches: [main]
  schedule:
    # nightly at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
        # govulncheck exits 0 when no reachable vulns; non-zero on any
        # reachable Critical/High. Module-level findings (unreachable)
        # do not fail the gate — they are documented in SECURITY_AUDIT.md.

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the scan
      - name: Install gitleaks
        run: |
          # The canonical Go module path is github.com/zricethezav/gitleaks.
          # (The github.com/gitleaks/gitleaks alias is broken — see
          # SECURITY_AUDIT.md §3.)
          go install github.com/zricethezav/gitleaks@latest
      - name: Run gitleaks
        run: |
          gitleaks --repo-path=. --report=gitleaks-report.json --redact
          # gitleaks exits 0 when 0 leaks; 1 when leaks found; 2 on error.
          # We fail the gate on any leak (exit 1) and on errors (exit 2).
          # The report file is uploaded as an artifact for triage.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  static-checks:
    name: vet + fmt + supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          # fail the gate if any file is not gofmt-clean.
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::gofmt needs to be applied to the following files:"
            gofmt -l .
            exit 1
          fi
      - name: supply-chain audit
        run: |
          # Verify the supply-chain posture. The audit checks GOSUMDB,
          # GOFLAGS=-mod=readonly, and that this workflow mentions both
          # govulncheck and gitleaks (it does, above).
          GOSUMDB=on GOFLAGS=-mod=readonly go test -run='^TestSupplyChainGate' ./auth/...
      - name: race tests on security surfaces
        run: |
          # Race-test the auth/authz/record/http packages — these are
          # the surfaces the security audit covers.
          go test -race ./auth/... ./authz/... ./record/... ./http/...
